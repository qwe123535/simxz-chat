name: Build APK

# 手动触发 + 每次推送到主分支都出一版
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    # 官方 Ubuntu runner：4 核 / 16 GB，比手机上快一个数量级
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 自带 Android SDK，直接用它，不引第三方 action
      # （android-actions/setup-android 在新版镜像上经常在 cmdline-tools 上挂掉）
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # release 用的是 debug 签名（仓库里没有 keystore.properties）：
      # 能装、能测，但**不能覆盖官方版**，装之前先卸载
      - name: Build
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/simple-chat-release.apk || true
          cp app/build/outputs/apk/debug/*.apk out/simple-chat-debug.apk || true
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-chat-apk
          path: out/*.apk
          retention-days: 14
