name: Build APK

# 手动触发 + 每次推送到主分支都出一版
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    # 官方 Ubuntu runner：4 核 / 16 GB，比手机上快一个数量级
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # 固定签名密钥：从仓库 Secret 还原成文件，交给 Gradle 用。
      #
      # 不这么做的话，每次 runner 都是全新的 debug 证书，出来的包签名各不相同 ——
      # 上一版就装不上，必须先卸载。固定之后同一包名的后续版本可以覆盖安装。
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 未配置，本次回落到 debug 签名（装不上上一版）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/simxz.jks"
          {
            echo "SIMXZ_KEYSTORE_FILE=$RUNNER_TEMP/simxz.jks"
            echo "SIMXZ_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SIMXZ_KEY_ALIAS=$KEY_ALIAS"
            echo "SIMXZ_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # runner 自带 Android SDK，直接用它，不引第三方 action
      # （android-actions/setup-android 在新版镜像上经常在 cmdline-tools 上挂掉）
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 || \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # release 用的是 debug 签名（仓库里没有 keystore.properties）：
      # 能装、能测，但**不能覆盖官方版**，装之前先卸载
      # 编译错误用 ::error:: 转成 GitHub annotation：
      # 日志下载要额外权限，annotation 用 API 就能读，排查快得多
      - name: Build
        run: |
          set +e
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E '^e: ' build.log | head -60 | sed 's/^e: /::error::/' || true
            grep -E '^> Task .* FAILED' build.log | head -10 | sed 's/^/::error::/' || true
          fi
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Rename artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/simple-chat-release.apk || true
          cp app/build/outputs/apk/debug/*.apk out/simple-chat-debug.apk || true

          # 校验和跟着包一起发：从网盘、第三方镜像、转发链接拿到的包，
          # 只要对一下 sha256 就知道是不是原件。
          cd out
          for f in *.apk; do
            [ -e "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-chat-apk
          path: |
            out/*.apk
            out/*.sha256
            out/SHA256SUMS.txt
          retention-days: 14
